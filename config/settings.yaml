# Configuracao do servico safra-dados.
# A raiz dos dados pode ser sobrescrita pela variavel de ambiente SAFRA_DADOS_HOME.
data_root: data

http:
  user_agent: "safra-dados/0.1 (uso academico/pesquisa; contato: walter.correa.neto@gmail.com)"
  timeout_seconds: 60
  max_retries: 5
  backoff_factor: 1.5
  # intervalo minimo, em segundos, entre requisicoes ao mesmo host
  min_interval_seconds: 0.5

fontes:
  bcb_ifdata:
    base_url: "https://olinda.bcb.gov.br/olinda/servico/IFDATA/versao/v1/odata"
    desde: "2015-03"
    # Tipos de instituicao do IFDATA (ver swagger):
    # 1 - Conglomerados Prudenciais e Instituicoes Independentes
    # 2 - Conglomerados Financeiros e Instituicoes Independentes
    # 3 - Instituicoes Individuais
    # 4 - Instituicoes com Operacoes de Cambio
    tipos_instituicao: [1]

  bcb_cosif:
    ckan_base_url: "https://dadosabertos.bcb.gov.br/api/3/action"
    ckan_package_id: "ifs-balancetes"
    segmento_base_url: "https://www.bcb.gov.br/content/estabilidadefinanceira/cosif"
    individualizado_base_url: "https://www4.bcb.gov.br/fis/cosif/cont/balan/individualizados"
    desde: "2015-03"
    # segmentos cobertos neste bloco: nome do diretorio -> sigla do arquivo
    segmentos:
      Bancos: BANCOS
      Conglomerados-prudenciais: BLOPRUDENCIAL
    # documentos historicos usados no endpoint individualizado (pre-2023, por CNPJ/conglomerado)
    documentos_individualizado: ["4010", "4040"]

  # ---- Bloco 2 (BCB complementar) ----
  # Olinda (URLs sempre via safra_dados.olinda.olinda_url)
  bcb_taxas_juros:
    base_url: "https://olinda.bcb.gov.br/olinda/servico/taxaJuros/versao/v2/odata"
    desde: "2024-01"

  bcb_tarifas:
    base_url: "https://olinda.bcb.gov.br/olinda/servico/Informes_ListaTarifasPorInstituicaoFinanceira/versao/v1/odata"
    # grupo consolidado "15" = todas as instituicoes com tarifas publicadas
    grupo_consolidado: "15"
    desde: "2026-01"   # instantaneo (so ha o valor vigente); data_base = mes da coleta

  bcb_unicad:
    # Cadastro de entidades supervisionadas (BcBase v2, Unicad)
    base_url: "https://olinda.bcb.gov.br/olinda/servico/BcBase/versao/v2/odata"
    desde: "2024-01"

  # NAO sao Olinda:
  bcb_reclamacoes:
    # API REST do RDR (ranking de reclamacoes), arquivos CSV por periodo
    base_url: "https://www3.bcb.gov.br/rdrweb/rest/ext/ranking"
    tipos: ["Bancos e financeiras"]
    desde: "2024-01"

  bcb_estban:
    # Estban (Estatistica Bancaria por municipio/agencia), arquivos mensais
    base_url: "https://www.bcb.gov.br/content/estatisticas/estatistica_bancaria_estban"
    niveis: ["municipio", "agencia"]
    desde: "2024-01"

  bcb_sgs:
    base_url: "https://api.bcb.gov.br/dados/serie"
    series:
      432: selic_meta
      433: ipca
      1: dolar_venda
      12: cdi
    desde: "2024-01"
