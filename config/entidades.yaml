# Entidades de interesse para coleta e comparacao.
#
# REGRA: a marcacao nas tabelas silver (colunas `grupo` e `is_safra`) usa SOMENTE
# identificadores (cnpj_raiz, cnpj, codigo_conglomerado_*), nunca o nome.
#
# "busca_nome_cvm" (opcional) sao os termos usados no cadastro da CVM (`resolver-entidades`
# sugere CNPJs CVM em `cvm.sugestoes`, so para revisao; ver README); sem ele vale "busca_nome".
#
# "busca_nome_susep" (opcional): termos usados contra a LISTAEMPRESAS da SUSEP; `resolver-entidades`
# grava as sugestoes em `susep.sugestoes.<grupo>.<entidade>` (codigo FIP + CNPJ, `aprovado: false`).
# Sem a chave, a entidade nao gera sugestoes SUSEP.
#
# "busca_nome" so e usado por `safra-dados resolver-entidades`:
#   - entidades COM identificador conhecido sao confirmadas por ele no
#     IfDataCadastro (status "confirmado") e ganham os CNPJs do conglomerado;
#   - entidades SEM identificador geram apenas SUGESTOES por nome (status
#     "sugestao") em config/entidades_resolvidas.yaml, para revisao humana: copie o
#     cnpj_raiz correto para ca, ou marque `aprovado: true` na entrada resolvida;
#   - `resolver_por_nome_lider: true` (so os pares) autoriza o resolvedor a
#     preencher CNPJ/conglomerado quando o nome casa com UMA unica instituicao
#     lider de conglomerado ativa (status "resolvido"); se houver mais de uma,
#     fica "ambiguo" e nada e marcado.

grupos:
  safra:
    descricao: "Conglomerado Banco Safra"
    cnpj_raiz: "58160789"
    entidades:
      banco_safra:
        descricao: "Banco Safra S.A. (banco multiplo, lider do conglomerado)"
        cnpj_raiz: "58160789"
        codigo_conglomerado_prudencial: "C0080109"

      banco_j_safra:
        descricao: "Banco J. Safra S.A."
        cnpj_raiz: "03017677"
        codigo_conglomerado_prudencial: "C0080109"

      seguradora_safra:
        descricao: "Safra Seguros / seguradora do conglomerado"
        cnpj_raiz: null
        busca_nome: ["safra seguros", "seguradora safra"]
        busca_nome_susep: ["safra seguros", "safra capitalizacao", "safra resseguros"]

      previdencia_safra:
        descricao: "Safra Vida e Previdencia"
        cnpj_raiz: null
        busca_nome: ["safra vida", "safra previdencia"]
        busca_nome_susep: ["safra vida", "safra previdencia"]

      asset_safra:
        descricao: "Safra Asset Management (gestora de recursos)"
        cnpj_raiz: null
        busca_nome: ["safra asset", "j. safra asset"]
        busca_nome_cvm: ["safra asset", "safra gestao", "safra servicos de administracao fiduciaria"]

      dtvm_safra:
        descricao: "Safra Distribuidora de Titulos e Valores Mobiliarios (DTVM)"
        cnpj_raiz: null
        busca_nome: ["safra distribuidora", "safra dtvm"]

      corretora_safra:
        descricao: "Safra Corretora de Valores e Cambio"
        cnpj_raiz: null
        busca_nome: ["safra corretora", "safra cvc", "safra ctvm"]

      banco_alfa:
        descricao: "Banco Alfa (ligado ao grupo Safra)"
        cnpj_raiz: null
        busca_nome: ["alfa"]
        busca_nome_cvm: ["banco alfa", "alfa corretora", "financeira alfa", "alfa arrendamento"]

  pares:
    descricao: "Pares para comparacao (grandes bancos)"
    entidades:
      itau_unibanco:
        descricao: "Itau Unibanco"
        cnpj_raiz: null
        busca_nome: ["itau unibanco holding"]
        busca_nome_susep: ["itau seguros", "itau vida", "itau capitalizacao", "itauseg", "itau unibanco seguros", "itauprev"]
        resolver_por_nome_lider: true

      bradesco:
        descricao: "Bradesco"
        cnpj_raiz: null
        busca_nome: ["banco bradesco s.a."]
        busca_nome_susep: ["bradesco"]
        resolver_por_nome_lider: true

      santander_brasil:
        descricao: "Santander Brasil"
        cnpj_raiz: null
        busca_nome: ["banco santander (brasil) s.a."]
        busca_nome_susep: ["santander"]
        resolver_por_nome_lider: true

      btg_pactual:
        descricao: "BTG Pactual"
        cnpj_raiz: null
        busca_nome: ["banco btg pactual s.a."]
        busca_nome_susep: ["btg pactual"]
        resolver_por_nome_lider: true

      banco_do_brasil:
        descricao: "Banco do Brasil"
        cnpj_raiz: null
        busca_nome: ["banco do brasil s.a."]
        busca_nome_susep: ["brasilseg", "brasilprev", "brasilcap", "bb capitalizacao", "bb seguridade", "alianca do brasil"]
        resolver_por_nome_lider: true
